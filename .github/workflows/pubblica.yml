# A ogni modifica dei contenuti: costruisce il sito, lo controlla e, se i controlli passano, lo pubblica.
name: Pubblica il sito
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pubblica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepara lo strumento che ottimizza le fotografie
        run: python3 -m pip install --quiet --break-system-packages pillow pillow-heif || python3 -m pip install --quiet pillow pillow-heif
      - name: Scarica le fotografie da Wikimedia Commons
        run: python3 strumenti/scarica_foto.py
      - name: Costruisce le pagine
        run: python3 costruisci.py
      - name: Controlla collegamenti, titoli e anteprime
        run: python3 controlla.py
      - name: Pubblica
        run: |
          cd pubblico
          git init -q -b gh-pages
          git config user.name "Pubblicazione automatica"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Sito pubblicato da ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" gh-pages
